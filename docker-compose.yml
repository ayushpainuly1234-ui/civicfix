services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix_dev_password
      POSTGRES_DB: civicfix
    ports:
      - "5432:5432"
    volumes:
      - civicfix_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix -d civicfix"]
      interval: 5s
      timeout: 3s
      retries: 15
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - civicfix_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  civicfix_postgres:
  civicfix_mongo:
